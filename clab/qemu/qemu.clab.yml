name: qemu
topology:
  groups:
    frr:
      kind: linux
      image: quay.io/frrouting/frr:10.6.0
      binds:
        - ../frrcommon/daemons:/etc/frr/daemons
        - ../frrcommon/vtysh.conf:/etc/frr/vtysh.conf
      exec:
        - sysctl -w net.ipv6.conf.all.forwarding=1
    agnhost:
      kind: linux
      image: "k8s.gcr.io/e2e-test-images/agnhost:2.40"
      cmd: netexec --http-port=8090
      exec:
        - sysctl -w net.ipv6.conf.all.keep_addr_on_down=1

  nodes:
    leafA:
      group: frr
      binds:
        - ../leafA/frr.conf:/etc/frr/frr.conf
        - ../leafA/setup.sh:/setup.sh
    leafB:
      group: frr
      binds:
        - ../leafB/frr.conf:/etc/frr/frr.conf
        - ../leafB/setup.sh:/setup.sh
    leafSRV6:
      group: frr
      binds:
        - ../leafSRV6/frr.conf:/etc/frr/frr.conf
        - ../leafSRV6/setup.sh:/setup.sh
    leafkind1:
      group: frr
      binds:
        - ../singlecluster/leafkind1/frr.conf:/etc/frr/frr.conf
    leafkind2:
      group: frr
      binds:
        - ../singlecluster/leafkind2/frr.conf:/etc/frr/frr.conf
    spine:
      group: frr
      binds:
        - ../singlecluster/spine/frr.conf:/etc/frr/frr.conf

    hostA_default:
      group: agnhost
      binds:
        - ../hostA_default/setup.sh:/setup.sh
    hostA_red:
      group: agnhost
      binds:
        - ../hostA_red/setup.sh:/setup.sh
    hostB_red:
      group: agnhost
      binds:
        - ../hostB_red/setup.sh:/setup.sh
    hostSRV6_red:
      group: agnhost
      binds:
        - ../hostSRV6_red/setup.sh:/setup.sh
    hostA_blue:
      group: agnhost
      binds:
        - ../hostA_blue/setup.sh:/setup.sh
    hostB_blue:
      group: agnhost
      binds:
        - ../hostB_blue/setup.sh:/setup.sh
    hostSRV6_blue:
      group: agnhost
      binds:
        - ../hostSRV6_blue/setup.sh:/setup.sh

    leafkind1-sw:
      kind: bridge

    leafkind2-sw:
      kind: bridge

    # Fake PF Bridges - Each represents a SR-IOV Physical Function
    # to simulate the NIC embedded switch

    # toleafkind1 PF: Connects 4 QEMU NICs (TAPs 0-3)
    # TAPs 0,1: trunk ports, TAP 2: VLAN 33, TAP 3: VLAN 44
    # Connects directly to leafkind1
    toleafkind1:
      kind: bridge

    # toswitch1 PF: Connects 4 QEMU NICs (TAPs 4-7)
    # TAPs 4,5: trunk ports, TAP 6: VLAN 33, TAP 7: VLAN 44
    toswitch1:
      kind: bridge

  

  links:
    - endpoints: ["leafA:eth1", "spine:eth1"]
    - endpoints: ["leafB:eth1", "spine:eth2"]
    - endpoints: ["leafSRV6:eth1", "spine:ethsrv6"]
    - endpoints: ["leafkind1:eth1", "spine:eth3"]
    - endpoints: ["leafkind2:eth1", "spine:eth4"]
    - endpoints: ["leafA:ethred", "hostA_red:eth1"]
    - endpoints: ["leafA:ethdefault", "hostA_default:eth1"]
    - endpoints: ["leafA:ethblue", "hostA_blue:eth1"]
    - endpoints: ["leafB:ethred", "hostB_red:eth1"]
    - endpoints: ["leafB:ethblue", "hostB_blue:eth1"]
    - endpoints: ["leafSRV6:ethred", "hostSRV6_red:eth1"]
    - endpoints: ["leafSRV6:ethblue", "hostSRV6_blue:eth1"]
    - endpoints: ["leafkind1:toswitch1", "leafkind1-sw:leaf1"]

    # toleafkind1 PF uplink to leafkind1
    - endpoints: ["toleafkind1:pf0-up", "leafkind1:toqemu"]

    # toswitch1 PF uplink to leafkind1-sw
    - endpoints: ["toswitch1:pf1-up", "leafkind1-sw:toqemu"]
